; 2026Bunkasai IRタグ - Arduino UNO 用 PlatformIO 設定
; このフォルダ(build/)をVSCodeで開き、下部ステータスバーで env を選んで Upload する。
;
;   env        スケッチ              用途
;   ir_beep    ir_beep/ir_beep.ino   最小構成: 何かIRが来たら鳴る(ライブラリ不要)
;   ir_dump    ir_dump/ir_dump.ino   リモコンのProtocol/Address/Commandを表示
;   ir_rx      ir_rx/ir_rx.ino       的側: 被弾判定・HP管理・演出
;   ir_tx      ir_tx/ir_tx.ino       銃側: NECでID付きの弾を発射

[platformio]
src_dir = .

[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps = z3t0/IRremote@^4.4.0

[env:ir_beep]
build_src_filter = +<ir_beep/>

[env:ir_dump]
build_src_filter = +<ir_dump/>

[env:ir_rx]
build_src_filter = +<ir_rx/>

[env:ir_tx]
build_src_filter = +<ir_tx/>
